# Configuração do DocFlow. Nenhum segredo aqui: tudo que é sensível vem de variáveis de ambiente
# (veja .env.example). Os padrões permitem rodar localmente sem nenhuma conta externa.

spring.application.name=docflow

# Banco de dados
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/docflow}
spring.datasource.username=${DB_USERNAME:docflow}
spring.datasource.password=${DB_PASSWORD:docflow}
spring.datasource.driverClassName=org.postgresql.Driver
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=${JPA_SHOW_SQL:false}
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# Jackson 3 ordena as propriedades em ordem alfabética por padrão; mantém a ordem declarada nos DTOs (como no Jackson 2)
spring.jackson.mapper.sort-properties-alphabetically=false

# Identidade do negócio (PDF do contrato, e-mails e assistente de IA)
app.branding.business-name=${APP_BUSINESS_NAME:DocFlow}
app.branding.owner-name=${APP_OWNER_NAME:}
app.branding.signature-image=${APP_SIGNATURE_IMAGE:}

# Assinatura eletrônica (Autentique). Sem token, o envio para assinatura fica indisponível.
autentique.api.url=${AUTENTIQUE_API_URL:https://api.autentique.com.br/v2/graphql}
autentique.api.token=${AUTENTIQUE_API_TOKEN:}
autentique.api.timeout-seconds=${AUTENTIQUE_TIMEOUT_SECONDS:15}
autentique.sandbox.enabled=${AUTENTIQUE_SANDBOX_ENABLED:true}
autentique.signature.position.x=${AUTENTIQUE_SIGNATURE_POSITION_X:18.0}
autentique.signature.position.y=${AUTENTIQUE_SIGNATURE_POSITION_Y:82.0}
autentique.account.auto-sign.enabled=${AUTENTIQUE_ACCOUNT_AUTO_SIGN_ENABLED:false}
autentique.account.email=${AUTENTIQUE_ACCOUNT_EMAIL:}

# E-mail (SMTP) para avisos de contrato assinado e lembretes de prazo
spring.mail.host=${SMTP_HOST:smtp.gmail.com}
spring.mail.port=${SMTP_PORT:587}
spring.mail.username=${SMTP_USERNAME:}
spring.mail.password=${SMTP_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.smtp.ssl.trust=${SMTP_SSL_TRUST:smtp.gmail.com}
spring.mail.properties.mail.smtp.ssl.protocols=${SMTP_SSL_PROTOCOLS:TLSv1.2}
spring.mail.properties.mail.smtp.connectiontimeout=${SMTP_CONNECTION_TIMEOUT:10000}
spring.mail.properties.mail.smtp.timeout=${SMTP_TIMEOUT:10000}
spring.mail.properties.mail.smtp.writetimeout=${SMTP_WRITE_TIMEOUT:10000}
app.notifications.email.enabled=${EMAIL_NOTIFICATIONS_ENABLED:false}
app.notifications.email.to=${EMAIL_NOTIFICATIONS_TO:}

# Frontend e arquivos
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173}
app.storage.contracts-dir=${STORAGE_CONTRACTS_DIR:uploads/contracts}
app.storage.tasks-dir=${STORAGE_TASKS_DIR:uploads/tasks}
# Tamanho máximo de upload (anexos de tarefas e PDFs de contrato). O nginx do Docker aceita até 20 MB.
spring.servlet.multipart.max-file-size=${UPLOAD_MAX_FILE_SIZE:20MB}
spring.servlet.multipart.max-request-size=${UPLOAD_MAX_FILE_SIZE:20MB}
app.tasks.reminders.cron=${TASK_REMINDERS_CRON:0 0 8 * * *}

# Assistente de IA (Ollama local). Desligado por padrão.
ai.enabled=${AI_ENABLED:false}
ai.ollama.url=${OLLAMA_URL:http://localhost:11434}
ai.ollama.model=${OLLAMA_MODEL:qwen2.5:3b}
ai.ollama.timeout-seconds=${OLLAMA_TIMEOUT_SECONDS:300}
ai.ollama.num-predict=${OLLAMA_NUM_PREDICT:500}
ai.ollama.num-thread=${OLLAMA_NUM_THREAD:4}
ai.ollama.think=${OLLAMA_THINK:false}
ai.ollama.num-ctx=${OLLAMA_NUM_CTX:8192}
ai.ollama.temperature=${OLLAMA_TEMPERATURE:0.6}
