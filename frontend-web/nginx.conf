# Limite de tentativas de login por IP: 5 por minuto, com folga para 5 seguidas (contra força bruta)
limit_req_zone $binary_remote_addr zone=login:10m rate=5r/m;

server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # Não informa a versão do nginx nas respostas
    server_tokens off;

    # Anexos de tarefas e PDFs de contrato (mesmo limite do backend: UPLOAD_MAX_FILE_SIZE)
    client_max_body_size 20m;

    # Acima do limite, responde no mesmo formato de erro da API, em vez da página HTML do nginx
    error_page 413 = @file_too_large;
    location @file_too_large {
        default_type application/json;
        return 413 '{"status":413,"code":"FILE_TOO_LARGE","message":"Arquivo maior que o limite de 20MB."}';
    }

    error_page 429 = @too_many_requests;
    location @too_many_requests {
        default_type application/json;
        return 429 '{"status":429,"code":"TOO_MANY_LOGIN_ATTEMPTS","message":"Muitas tentativas de login. Aguarde um minuto e tente de novo."}';
    }

    # Login: mesmo proxy da API, com o limite de tentativas
    location = /api/auth/login {
        limit_req zone=login burst=5 nodelay;
        limit_req_status 429;
        proxy_pass http://backend:8080/auth/login;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # API: mesma origem do frontend, então não há CORS. Os cabeçalhos de segurança da API vêm do Spring Security.
    location /api/ {
        proxy_pass http://backend:8080/;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 300s;
    }

    # SPA: rotas do React voltam para o index.html
    location / {
        # Só scripts, estilos e frames da própria origem (mais a fonte do Google Fonts); bloqueia o app dentro de sites de terceiros
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' data: https://fonts.gstatic.com; img-src 'self' data: blob:; frame-src 'self' blob:; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'self'" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "same-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
        try_files $uri $uri/ /index.html;
    }
}
