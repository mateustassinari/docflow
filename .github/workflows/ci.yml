name: CI

on:
  push:
    branches: [main]
  pull_request:

# Um push novo na mesma branch cancela a execução anterior
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend:
    name: Backend (testes)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 25

      - uses: gradle/actions/setup-gradle@v6

      # Inclui os testes com Postgres real (Testcontainers usa o Docker do runner)
      - name: Testes
        run: ./gradlew test

      - name: Relatório dos testes
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: relatorio-testes
          path: build/reports/tests/test

  frontend:
    name: Frontend (lint e build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend-web
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend-web/package-lock.json

      - run: npm ci

      # O build roda o ESLint antes do Vite
      - run: npm run build

  docker:
    name: Imagens Docker
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Build das imagens do compose
        run: docker compose build
